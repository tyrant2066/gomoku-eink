<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>高智商人机五子棋</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- 顶部栏 -->
    <header id="topbar">
      <div id="player-black" class="player">
        <span class="stone black"></span>
        <span class="label">黑方</span>
        <span class="mark" id="mark-black">●</span>
      </div>
      <div id="score" class="score"><span id="score-black">0</span>:<span id="score-white">0</span></div>
      <div id="player-white" class="player">
        <span class="label">白方</span>
        <span class="stone white"></span>
        <span class="mark" id="mark-white">●</span>
      </div>
    </header>

    <!-- 棋盘区 -->
    <main id="board-wrap">
      <canvas id="board" width="600" height="600"></canvas>
      <div id="status-bar">
        <span id="status-text">黑方先行</span>
      </div>
    </main>

    <!-- 底部工具栏 -->
    <footer id="toolbar">
      <button id="btn-new" class="tool-btn">新开</button>
      <button id="btn-undo" class="tool-btn">悔棋</button>
      <button id="btn-settings" class="tool-btn">设置</button>
      <button id="btn-about" class="tool-btn">关于</button>
    </footer>

    <!-- 覆盖层（新开 / 认输 / 胜利提示） -->
    <div id="overlay" class="hidden">
      <div id="overlay-box">
        <h2 id="ov-title"></h2>
        <p id="ov-desc"></p>
        <div id="choice-row"></div>
        <button id="ov-close">关闭</button>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
